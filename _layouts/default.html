<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ page.description | default: site.description | escape }}" />
    <meta name="theme-color" content="#ffffff" />
    <title>{{ page.title | default: site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="site-title" href="{{ '/' | relative_url }}#top">{{ site.title }}</a>
        <div class="header-actions">
          <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
            <a href="{{ '/' | relative_url }}">About</a>
            <a href="{{ '/publications/' | relative_url }}">Publications</a>
            <a href="{{ '/education/' | relative_url }}">Education</a>
            <a href="{{ '/blog/' | relative_url }}">Blog</a>
          </nav>
          <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode">
            <span aria-hidden="true">☾</span>
          </button>
          <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
        </div>
      </div>
    </header>

    {% if page.profile != false %}
      <main id="top" class="page-layout">
        <aside class="profile-card">
          <img class="profile-photo" src="{{ '/selfie.jpeg' | relative_url }}" alt="Balaji Ramachandran" />
          <h1>Balaji Ramachandran</h1>
          <p class="profile-role">PhD Student in Mathematical Sciences</p>
          <p class="profile-affiliation">Carnegie Mellon University<br />Pittsburgh, Pennsylvania</p>
          <div class="profile-links" aria-label="Profile links">
            <a href="mailto:balajira@andrew.cmu.edu" aria-label="Email" title="Email">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 5.5h18v13H3z" /><path d="m4 7 8 6 8-6" /></svg>
              <span>Email</span>
            </a>
            <a href="https://scholar.google.com/citations?view_op=list_works&amp;hl=en&amp;user=kNDc_dYAAAAJ" target="_blank" rel="noreferrer" aria-label="Google Scholar" title="Google Scholar">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 9 9-5 9 5-9 5z" /><path d="M6 11v4.5c2.7 2.3 9.3 2.3 12 0V11M21 9v7" /></svg>
              <span>Scholar</span>
            </a>
            <a href="https://www.linkedin.com/in/balaji-ram-b45061257" target="_blank" rel="noreferrer" aria-label="LinkedIn" title="LinkedIn">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 8.5V19M5 5.5v.1M10 19v-6a3 3 0 0 1 6 0v6M10 10v9" /></svg>
              <span>LinkedIn</span>
            </a>
            <a href="https://github.com/BalajiRam7" target="_blank" rel="noreferrer" aria-label="GitHub" title="GitHub">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 19c-4 1.2-4-2-5.5-2.5M15 19v-2.2c0-.7.3-1.4.9-1.8 2-.7 4.1-1.8 4.1-5.2a4 4 0 0 0-1.1-3.1c.1-.3.5-1.6-.1-3.1 0 0-1-.3-3.2 1.2a11 11 0 0 0-5.8 0C7.6 5.3 6.6 5.6 6.6 5.6c-.6 1.5-.2 2.8-.1 3.1a4 4 0 0 0-1.1 3.1c0 3.4 2.1 4.5 4.1 5.2.6.4.9 1.1.9 1.8V19" /></svg>
              <span>GitHub</span>
            </a>
          </div>
        </aside>
        <article class="content">{{ content }}</article>
      </main>
    {% else %}
      {{ content }}
    {% endif %}

    <footer class="site-footer">© 2026 {{ site.title }}</footer>
    <script>
      const toggle = document.querySelector('.nav-toggle');
      const nav = document.querySelector('.site-nav');
      const themeToggle = document.querySelector('.theme-toggle');
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      const setTheme = (theme) => {
        const isDark = theme === 'dark';
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
        themeToggle.querySelector('span').textContent = isDark ? '☀' : '☾';
        themeToggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
        themeToggle.setAttribute('title', isDark ? 'Switch to light mode' : 'Switch to dark mode');
        themeToggle.setAttribute('aria-pressed', String(isDark));
      };

      setTheme(savedTheme || (prefersDark ? 'dark' : 'light'));
      themeToggle.addEventListener('click', () => {
        const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', nextTheme);
        setTheme(nextTheme);
      });

      toggle.addEventListener('click', () => {
        const open = nav.classList.toggle('is-open');
        toggle.setAttribute('aria-expanded', String(open));
      });
      nav.querySelectorAll('a').forEach((link) => link.addEventListener('click', () => {
        nav.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
      }));
    </script>
  </body>
</html>
